<!DOCTYPE html>   
<head>    
<title> proste obliczenia</title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:red;font-size:50px;"> 
<script language="JavaScript"> 
var D1_hen=prompt("Dzień1=",""); 
var D2_hen=prompt("Dzień2=",""); 
var dni; 
var kir; 
var a=parseFloat(D1_hen); 
var b=parseFloat(D2_hen); 
dni=a-b; 
kir=dni*24*60*60;
document.write("D1="+D1_hen+"<br>"); 
document.write("D2="+D2_hen+"<br>"); 
document.write("ilość sekund="+kir+"sekund <br>"); 
</script> 
</div> 
</body> 
</html>
